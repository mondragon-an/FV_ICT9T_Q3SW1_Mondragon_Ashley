<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>currency converter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik+Wet+Paint&display=swap" rel="stylesheet">
    <style>
        h1{
            text-align: center;
            font-size: 45px;
            font-family: Poppins;
        }
        body{
            margin-top: 100px;
            font-family: Poppins;
            text-align: center;
        }
        h2{
            font-size: 25px;
            font-weight: 400;
        }
        .btn{
            font-family: Poppins;
            font-size: 25px;
            font-weight: 400;
            border: 5px black solid;
            border-radius: 17px;
            background-color: white;
        }
        kbd{
            font-family: Poppins;
            font-size: 25px;
        }
        .container{
            background-color: lightpink;
            padding: 50px;
            border-radius: 17px;
            border: 7px black solid;
        }
    </style>
</head>

<body>
<div class="container container-fluid">
<h1>currency converter ── .✦</h1>
<br>
 
    <script>
        var php = 100;// given value
        document.write("<h2>click the buttons bellow to convert</h2>" + "<kbd>" + php + "</kbd>" + "<h2> philippine pesos to other currencies</h2>");

    </script>
<br> 

<p id = "display"> </p>
<br>
<button type="button" class="btn" onclick="let php = 100; let usd = 58.66; document.getElementById('display').innerHTML= '<kbd>' + php/usd + '</kbd>';">usd</button>
<button type="button" class="btn" onclick="let php = 100; let yen = 2.69; document.getElementById('display').innerHTML= '<kbd>' + php*yen + '</kbd>';">yen</button>

<br><br>
<a href="index.html"><button class="btn">refresh</button></a>
</div>
</body>

</html>
